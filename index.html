<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TBS - Registro de Bitácoras odómetro</title>
    <meta name="description" content="Aplicación móvil para el registro de bitácoras y control operativo de TBS Logistics Services.">
    <meta property="og:title" content="TBS - Registro de Bitácoras odómetro">
    <meta property="og:description" content="Aplicación móvil para el registro de bitácoras y control operativo de TBS Logistics Services.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TBS">
    <link rel="icon" type="image/png" href="https://appdesignproyectos.com/tlsicono.png">
    <link rel="apple-touch-icon" href="https://appdesignproyectos.com/tlsicono.png">
    
    <style>
      :root {
        --header-height: 70px;
      }
      body {
        font-family: 'Inter', sans-serif;
        overscroll-behavior-y: contain;
      }
      /* Prevenir saltos de diseño en el scroll */
      main {
        padding-top: var(--header-height);
      }
      /* Animaciones de entrada para bitácoras */
      .trip-card {
        animation: slideUp 0.4s ease-out forwards;
      }
      @keyframes slideUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      /* Ocultar flechas en input[type=number] */
      input[type=number]::-webkit-inner-spin-button, 
      input[type=number]::-webkit-outer-spin-button { 
        -webkit-appearance: none; 
        margin: 0; 
      }
      input[type=number] {
        -moz-appearance: textfield;
      }
    </style>
    <!-- React Refresh Preamble Safety Stub -->
    <script type="module">
      window.$RefreshReg$ = window.$RefreshReg$ || (() => {});
      window.$RefreshSig$ = window.$RefreshSig$ || (() => (type) => type);
      window.__vite_plugin_react_preamble_installed__ = true;
    </script>
    <link rel="stylesheet" href="/index.css">
</head>
<body class="bg-slate-50 text-slate-900 antialiased">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
